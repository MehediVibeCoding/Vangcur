function mount(b){const L=[{o:0,a:46,c:['#9db8da','#c9dbee'],s:.007,p:.7,sn:1},{o:20,a:32,c:['#8eb0d2','#bcd6e8'],s:.011,p:2.4,sn:0}];

    if(m.sn){ctx.fillStyle='rgba(255,255,255,.78)';for(let i=1;i<pts.length-1;i++)if(pts[i][1]<pts[i-1][1]&&pts[i][1]<pts[i+1][1]&&pts[i][1]<b-14-m.a*.7){const [x,y]=pts[i];ctx.beginPath();ctx.moveTo(x-12,y+10);ctx.lineTo(x,y);ctx.lineTo(x+12,y+10);ctx.lineTo(x+4,y+7);ctx.lineTo(x,y+12);ctx.lineTo(x-5,y+8);ctx.closePath();ctx.fill()}}}
